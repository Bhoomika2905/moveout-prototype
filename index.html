<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>MoveOut Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: prototype task bar on top, app header, then a two-column app body (filters | results, list | chat, photo | form) that stacks on phones. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e3e9e6; --ink:#15211d; --muted:#5a6b64; --line:#d3dcd8;
  --brand:#0e5a47; --brand-2:#0b4a3a; --on-brand:#ffffff;
  --box:#d9b98f; --box-2:#efe0c9; --box-ink:#5b3f1d;
  --ai:#5b47c8; --ai-bg:#ecebfb;
  --ok:#1d7a4a; --ok-bg:#e1f3e8; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b3261e; --bad-bg:#fbe5e3;
  --t1:#e6ddcf; --t2:#d7e5df; --t3:#dfe0ee; --t4:#ecdcd6; --art:#3a4a44;
  --proto:#15211d; --on-proto:#e8efec;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161f1c; --sunk:#1d2824; --ink:#e4ebe8; --muted:#97a8a1; --line:#2b3833;
  --brand:#4fc4a1; --brand-2:#6fd6b6; --on-brand:#06261d;
  --box:#8a6a45; --box-2:#3a2f22; --box-ink:#f0d9b8;
  --ai:#ab9cff; --ai-bg:#26213f;
  --ok:#6fd39b; --ok-bg:#17301f; --warn:#f2b552; --warn-bg:#33270f; --bad:#ff8f86; --bad-bg:#3a1a18;
  --t1:#2c2822; --t2:#1f2c27; --t3:#24253a; --t4:#30231f; --art:#c5d2cc;
  --proto:#050807; --on-proto:#cfdcd6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161f1c; --sunk:#1d2824; --ink:#e4ebe8; --muted:#97a8a1; --line:#2b3833;
  --brand:#4fc4a1; --brand-2:#6fd6b6; --on-brand:#06261d;
  --box:#8a6a45; --box-2:#3a2f22; --box-ink:#f0d9b8;
  --ai:#ab9cff; --ai-bg:#26213f;
  --ok:#6fd39b; --ok-bg:#17301f; --warn:#f2b552; --warn-bg:#33270f; --bad:#ff8f86; --bad-bg:#3a1a18;
  --t1:#2c2822; --t2:#1f2c27; --t3:#24253a; --t4:#30231f; --art:#c5d2cc;
  --proto:#050807; --on-proto:#cfdcd6; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px;border-radius:4px}
.price,.num{font-variant-numeric:tabular-nums}

/* prototype bar */
.proto{background:var(--proto);color:var(--on-proto);font-size:.82rem}
.proto .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.proto b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;opacity:.75}
.task{background:transparent;border:1px solid color-mix(in srgb,var(--on-proto) 30%,transparent);color:var(--on-proto);border-radius:99px;padding:3px 11px;cursor:pointer}
.task:hover{background:color-mix(in srgb,var(--on-proto) 12%,transparent)}
.task span{opacity:.6;margin-right:4px}
.proto .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.switch input{accent-color:var(--bad)}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--proto)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.logo .mark{width:30px;height:30px;border-radius:7px;background:var(--box);color:var(--box-ink);display:grid;place-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:99px;background:var(--sunk)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{position:relative;padding:7px 12px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:500}
nav.main a:hover{background:var(--sunk);color:var(--ink)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.main a.sell{background:var(--brand);color:var(--on-brand)}
nav.main a.sell[aria-current="page"]{background:var(--brand-2)}
.badge-n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:600}
.me{display:flex;align-items:center;gap:8px;font-size:.82rem}
.av{width:32px;height:32px;border-radius:50%;background:var(--t3);display:grid;place-items:center;font-weight:600;font-size:.8rem;flex:none}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:500;font-size:.8rem}

main{padding-block:24px 64px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--brand);color:var(--on-brand);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.ai{background:var(--ai);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.text{background:none;color:var(--muted);padding:9px 8px}
.btn.text:hover{color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.available{background:var(--ok-bg);color:var(--ok)}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.pill.sold{background:var(--bad-bg);color:var(--bad)}
.pill.ai{background:var(--ai-bg);color:var(--ai)}
.pill.edited{background:var(--sunk);color:var(--muted)}
.pill.mine{background:var(--box-2);color:var(--box-ink)}
.pill.wait{background:var(--warn-bg);color:var(--warn)}

/* art */
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--art);overflow:hidden}
.thumb svg{width:62%;height:auto}
.thumb img{width:100%;height:100%;object-fit:cover}
.tone1{background:var(--t1)}.tone2{background:var(--t2)}.tone3{background:var(--t3)}.tone4{background:var(--t4)}
.art .h{fill:var(--surface)}

/* browse */
.browse{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:84px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--brand);width:16px;height:16px}
input[type=range]{width:100%;accent-color:var(--brand)}
.rangeval{display:flex;justify-content:space-between;font-size:.85rem}
.res-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.res-tools{display:flex;gap:10px;align-items:center}
select,.input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px}
.active-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:0}
.active-chips button{border:0;background:var(--sunk);border-radius:99px;padding:3px 10px;font-size:.8rem;cursor:pointer}
.active-chips button::after{content:" ×";color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 10%,transparent)}
.card .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px}
.card .price{font-family:var(--display);font-weight:800;font-size:1.2rem}
.card .title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:.8rem;color:var(--muted)}
.card .tl{position:absolute;left:8px;top:8px;display:flex;gap:5px}
.heart{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);box-shadow:0 1px 4px color-mix(in srgb,var(--ink) 15%,transparent)}
.heart[aria-pressed="true"]{color:var(--bad)}
.heart[aria-pressed="true"] path{fill:currentColor}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.only-narrow{display:none}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;margin-bottom:14px;background:none;border:0;cursor:pointer;padding:0}
.back:hover{color:var(--ink)}
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:start}
.gallery .thumb{border-radius:var(--r)}
.gallery .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gallery .thumbs button{border:2px solid transparent;border-radius:var(--r-sm);padding:0;overflow:hidden;cursor:pointer;background:none}
.gallery .thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.v1 svg{transform:scale(1.35) translate(8%,6%)}
.v2 svg{transform:scaleX(-1) rotate(-6deg)}
.dinfo{display:flex;flex-direction:column;gap:18px}
.dprice{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.92rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.seller{display:flex;gap:12px;align-items:center}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-sm);font-size:.9rem}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.ai{background:var(--ai-bg);color:var(--ai)}
.banner.info{background:var(--sunk);color:var(--muted)}
.banner svg{flex:none;margin-top:2px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
textarea{width:100%;resize:vertical;min-height:80px}

/* sell */
.stepper{display:flex;gap:6px;align-items:center;margin-bottom:20px;flex-wrap:wrap;font-size:.85rem}
.stepper span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.stepper i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:600;font-size:.75rem}
.stepper .on{color:var(--ink);font-weight:600}
.stepper .on i{background:var(--brand);color:var(--on-brand)}
.stepper .done i{background:var(--ok-bg);color:var(--ok)}
.stepper .sep{width:24px;height:1px;background:var(--line)}
.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.drop.locked{cursor:not-allowed;background:var(--sunk);opacity:.75}
.drop.locked:hover{border-color:var(--line);background:var(--sunk)}
.aicard{border:1px solid color-mix(in srgb,var(--ai) 40%,var(--line));background:var(--ai-bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.drop .ic{width:56px;height:56px;border-radius:14px;background:var(--box-2);color:var(--box-ink);display:grid;place-items:center}
.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sample{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);cursor:pointer;padding:0;text-align:left}
.sample:hover{border-color:var(--brand)}
.sample .cap{padding:8px 10px;font-size:.85rem}
.sellgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
.sellgrid .thumb{border-radius:var(--r)}
.progress{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.progress li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.progress li.now{color:var(--ink);font-weight:500}
.progress li.did{color:var(--ok)}
.progress ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.now .dot{border-color:var(--ai);border-top-color:transparent;animation:spin .8s linear infinite}
.did .dot{border-color:var(--ok);background:var(--ok);color:var(--surface)}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);width:0;transition:width .5s}
form.listing{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.field .input,.field select,.field textarea{width:100%}
.field .hint{font-size:.82rem;color:var(--muted)}
.field .err{font-size:.82rem;color:var(--bad);font-weight:500}
.field.invalid .input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg label{text-align:center;padding:8px 4px;cursor:pointer;font-size:.88rem;border-left:1px solid var(--line);background:var(--surface)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);font-weight:600}
.seg label:has(input:focus-visible){outline:3px solid var(--ai);outline-offset:-3px}
.money{position:relative}
.money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money input{padding-left:24px;font-variant-numeric:tabular-nums}
.suggest{border:1px solid color-mix(in srgb,var(--ai) 35%,var(--line));background:color-mix(in srgb,var(--ai-bg) 60%,var(--surface));border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.suggest .big{font-family:var(--display);font-size:1.5rem;font-weight:800}
.scale{position:relative;height:40px;margin-top:4px}
.scale .track{position:absolute;left:0;right:0;top:12px;height:8px;border-radius:99px;background:var(--sunk)}
.scale .band{position:absolute;top:12px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--ai) 45%,transparent)}
.scale .med{position:absolute;top:7px;width:3px;height:18px;margin-left:-1.5px;background:var(--ai);border-radius:2px}
.scale .you{position:absolute;top:4px;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.scale .lbl{position:absolute;top:24px;font-size:.72rem;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
details.why summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--ai)}
details.why p{font-size:.85rem;margin-top:6px;color:var(--muted)}
.success{max-width:560px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.success .tick{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.success .card{width:260px;text-align:left}

/* inbox */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;min-height:600px}
.ilist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.trow{display:flex;gap:11px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.trow:hover{background:var(--sunk)}
.trow[aria-current="true"]{background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.trow .thumb{width:52px;flex:none;border-radius:var(--r-sm);aspect-ratio:1}
.trow .thumb svg{width:80%}
.trow .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.trow .who{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem}
.trow .snip{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.trow.waiting{box-shadow:inset 3px 0 0 var(--warn)}
.chat{display:flex;flex-direction:column;min-width:0}
.chead{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chead .thumb{width:46px;border-radius:var(--r-sm);aspect-ratio:1}
.chead .thumb svg{width:80%}
.chead .tx{flex:1;min-width:0}
.statusseg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:.8rem}
.statusseg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;border-left:1px solid var(--line)}
.statusseg button:first-child{border-left:0}
.statusseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;background:var(--bg)}
.msg{max-width:78%;display:flex;flex-direction:column;gap:3px}
.msg .bub{padding:9px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--brand);color:var(--on-brand);border-color:transparent}
.msg .st{font-size:.72rem;color:var(--muted)}
.sysnote{align-self:center;font-size:.78rem;color:var(--muted);background:var(--sunk);padding:4px 12px;border-radius:99px}

/* ---------- pricing rule (from proposal) ---------- */
function pct(a,p){const s=[...a].sort((x,y)=>x-y);const i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
const rnd=v=>v>=20?Math.round(v/5)*5:Math.round(v);
function suggest(cat,cond){
  if(!cat||!cond) return null;
  const same=COMPS.filter(c=>c.cat===cat&&c.cond===cond).map(c=>c.price);
  if(same.length>=3) return {level:'normal',n:same.length,low:rnd(pct(same,.25)),high:rnd(pct(same,.75)),mid:rnd(pct(same,.5)),
    basis:`based on ${same.length} similar ${NOUN[cat]} in ${cond} condition`,
    why:`We looked at ${same.length} ${NOUN[cat]} in ${cond} condition listed or sold on MoveOut. The middle half sold or listed between the two ends of this range, and the marker is the median.`};
  const any=COMPS.filter(c=>c.cat===cat).map(c=>c.price/FACTOR[c.cond]*FACTOR[cond]);
  if(any.length>=3) return {level:'sparse',n:any.length,low:rnd(pct(any,.25)),high:rnd(pct(any,.75)),mid:rnd(pct(any,.5)),
    basis:`based on ${any.length} ${NOUN[cat]} in any condition`,
    why:`Fewer than 3 ${NOUN[cat]} in ${cond} condition are on MoveOut, so we used all ${any.length} ${NOUN[cat]} and adjusted each price to ${cond} condition (${Math.round(FACTOR[cond]*100)}% of new).`};
  const r=ROUGH[cat]||ROUGH.Other;const k=FACTOR[cond]/.7;
  return {level:'low',n:any.length,low:rnd(r[0]*k),high:rnd(r[1]*k),mid:rnd((r[0]+r[1])/2*k),
    basis:'estimated from your description',
    why:`Only ${any.length} similar item${any.length===1?' is':'s are'} on MoveOut so far, so this range is a rough estimate from the item description. Check prices elsewhere before you decide.`};
}

/* ---------- routing ---------- */
function go(h){ if(location.hash==='#'+h) route(); else location.hash=h; }
window.addEventListener('hashchange',route);
function route(){
  const h=location.hash.slice(1)||'browse';
  let view=h, param=null;
  if(h.startsWith('item-')){view='detail';param=+h.slice(5)}
  else if(h.startsWith('chat-')){view='inbox';param=h.slice(5)}
  if(!['browse','detail','sell','inbox','mine'].includes(view)) view='browse';
  S.view=view;
  if(view==='inbox') S.active=param;
  renderNav();
  const app=$('#app');
  if(view==='browse'){app.innerHTML=vBrowse();renderGrid()}
  else if(view==='detail'){const l=L(param);if(!l){go('browse');return}S.detailView=0;app.innerHTML=vDetail(l)}
  else if(view==='sell'){app.innerHTML=vSell();mountSell()}
  else if(view==='inbox'){app.innerHTML=vInbox();scrollChat()}
  else if(view==='mine'){app.innerHTML=vMine()}
  if(!S._keepScroll) window.scrollTo(0,0);
  S._keepScroll=false;
}
function rerender(){S._keepScroll=true;route()}

function renderNav(){
  const needs=S.threads.filter(t=>t.role==='selling'&&t.unread).length;
  const items=[['browse','Browse'],['inbox','Messages'],['mine','My listings'],['sell','Sell an item']];
  const cur=S.view==='detail'?'browse':S.view;
  $('#nav').innerHTML=items.map(([h,t])=>`<a href="#${h}" class="${h==='sell'?'sell':''}" ${cur===h?'aria-current="page"':''}>${t}${h==='inbox'&&needs?`<span class="badge-n" aria-label="${needs} need a reply">${needs}</span>`:''}</a>`).join('');
}

function filtered(){
  const f=S.f, words=f.q.toLowerCase().split(/\s+/).filter(Boolean);
  let r=S.listings.filter(l=>l.status!=='Sold'&&!l.deleted);
  if(words.length) r=r.filter(l=>{const t=(l.title+' '+l.desc+' '+l.cat).toLowerCase();return words.every(w=>t.includes(w.replace(/s$/,'')))});
  if(f.cat!=='All') r=r.filter(l=>l.cat===f.cat);
  if(f.max<150) r=r.filter(l=>l.price<=f.max);
  if(f.conds.length) r=r.filter(l=>f.conds.includes(l.cond));
  if(f.dist!=='any') r=r.filter(l=>dist(l)<=+f.dist);
  if(!f.pending) r=r.filter(l=>l.status!=='Pending');
  if(f.saved) r=r.filter(l=>l.saved);
  const s={new:(a,b)=>a.posted-b.posted,low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,near:(a,b)=>dist(a)-dist(b)}[f.sort];
  return r.sort(s);
}

  return `<article class="card" data-act="open" data-id="${l.id}" tabindex="0" aria-label="${esc(l.title)}, $${l.price}">

function renderSuggest(){
  const box=$('#suggest');if(!box)return;
  const s=S.sell,sg=suggest(s.f.cat,s.f.cond);
  if(!sg){box.innerHTML=`<div class="banner info">${ICON.spark}<span>Choose a category and condition to see a suggested price.</span></div>`;renderPriceWarn();return}
  if(S.aiFail&&sg.level==='low'){box.innerHTML='';}
  const max=Math.max(sg.high*1.6,(+s.f.price||0)*1.1,10);const P=v=>Math.min(100,v/max*100);
  box.innerHTML=`<div class="suggest">
    <div class="row" style="justify-content:space-between"><span class="flabel" style="color:var(--ai)">Suggested price</span>
      ${sg.level==='low'?'<span class="pill wait">Low confidence</span>':sg.level==='sparse'?'<span class="pill edited">Limited data</span>':''}</div>
    <div class="row" style="justify-content:space-between;align-items:baseline"><span class="big price">$${sg.low} – $${sg.high}</span>
      <button type="button" class="btn ai sm" data-act="usemid" data-v="${sg.mid}">Use $${sg.mid}</button></div>
    <span class="small muted">${esc(sg.basis)}</span>
    <div class="scale" aria-hidden="true"><div class="track"></div>
      <div class="band" style="left:${P(sg.low)}%;width:${P(sg.high)-P(sg.low)}%"></div>
      <div class="med" style="left:${P(sg.mid)}%"></div>
      ${+s.f.price?`<div class="you" style="left:${P(+s.f.price)}%" title="Your price"></div>`:''}
      <span class="lbl" style="left:${P(sg.low)}%">$${sg.low}</span><span class="lbl" style="left:${P(sg.high)}%">$${sg.high}</span>
    </div>
    <details class="why"><summary>How we got this</summary><p>${esc(sg.why)}</p></details>
  </div>`;
  renderPriceWarn();

function renderPriceWarn(){

function readFile(file){
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){toast('That file type is not supported. Choose a JPG, PNG or WebP photo.');return}
  const r=new FileReader();r.onload=()=>{S.sell.file=r.result;S.sell.blob=file;S.sell.photo=null;startAnalysis()};r.readAsDataURL(file);
}

/* Real photo recognition: asks Claude (vision) about the uploaded photo */
const samplePromise=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null);
const VISION_PROMPT=`You are the listing assistant for MoveOut, a marketplace where university students sell their belongings when they move out of dorms and apartments.
Look at the attached photo and identify the main item being sold.

Reply with only one JSON object, no other text:
{"sellable": true or false,
 "reason": "only if sellable is false: why, in under 12 words",
 "title": "specific listing title, at most 60 characters; include brand, size or color only if visible",
 "category": one of ${JSON.stringify(CATS)},
 "condition": one of ["New","Like new","Good","Fair"],
 "description": "2 or 3 plain sentences for buyers: what it is, visible size or features, and any visible wear. Do not invent details you cannot see.",
 "confidence": "high", "medium" or "low"}

Condition guide: New = unused or still boxed; Like new = no visible wear; Good = light wear; Fair = clear wear or a visible flaw.
If the photo does not show an item someone would sell (for example a person, a landscape, a screenshot or a blank image), set sellable to false.`;
const FAIL_COPY={
  unavailable:"AI photo reading isn't available in this view. Fill in the details below.",
  not_granted:"AI photo reading wasn't allowed, so fill in the details below.",
  image_rejected:"We couldn't open that photo. Try a JPG or PNG under 20 MB, or fill in the details below.",
  rate_limited:"Too many AI requests right now. Try again in a minute, or fill in the details below.",
  timeout:"Reading the photo took too long. Try again, or fill in the details below.",
};
async function readPhotoWithAI(s,setStep,lis){
  [1,2].forEach(i=>s.timers.push(setTimeout(()=>setStep(i),i*1300)));
  const fail=(code,msg)=>{if(S.sell!==s||s.step!=='analyzing')return;s.timers.forEach(clearTimeout);s.failed=true;s.failMsg=msg||FAIL_COPY[code]||"We couldn't read this photo. Try again, or fill in the details below.";s.retry=code!=='unavailable'&&code!=='not_granted';s.ai={};s.step='review';rerender()};
  const sample=await samplePromise;
  const lim=sample?await sample.limits().catch(()=>null):null;
  if(!sample||!lim||!lim.images) return fail('unavailable');
  s.ctl=new AbortController();
  try{
    const r=await sample.json(VISION_PROMPT,{images:[s.blob],signal:s.ctl.signal,modelTier:'default',effort:'low'});
    if(S.sell!==s||s.step!=='analyzing') return;
    if(!r||typeof r!=='object') return fail('bad');
    if(r.sellable===false) return fail('notitem',`We couldn't find an item to sell in this photo${r.reason?' ('+String(r.reason).replace(/\.$/,'')+')':''}. Try a clearer photo, or fill in the details below.`);
    const cat=CATS.includes(r.category)?r.category:'Other';
    const cond=CONDS.find(c=>c.toLowerCase()===String(r.condition||'').toLowerCase())||'';
    s.timers.forEach(clearTimeout);setStep(3);
    s.timers.push(setTimeout(()=>{
      if(S.sell!==s||s.step!=='analyzing') return;
      Object.assign(s.f,{title:String(r.title||'').slice(0,70),desc:String(r.description||''),cat,cond});
      s.ai={title:true,desc:true,cat:true};if(cond)s.ai.cond=true;
      s.lowConf=r.confidence==='low';s.failed=false;s.step='review';rerender();
      toast('Details filled in. Check them before publishing.');
    },700));
  }catch(e){
    if(e&&e.code==='cancelled') return;
    if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')) AIPERM=e.code==='not_granted'?'denied':'unavailable';
    fail(e&&e.code);
  }
}

/* Whether the viewer has allowed this page to use their Claude */
let AIPERM='checking';
const permsPromise=(window.claude&&window.claude.use)?window.claude.use('permissions').catch(()=>null):Promise.resolve(null);
function refreshAI(){if(S.view==='sell'&&S.sell.step==='photo')rerender()}
async function checkAI(){
  const sample=await samplePromise;
  const lim=sample?await sample.limits().catch(()=>null):null;
  if(!sample||!lim||!lim.images){AIPERM='unavailable';return refreshAI()}
  const perms=await permsPromise;
  AIPERM=perms?await perms.state('sample').catch(()=>'prompt'):'prompt';
  refreshAI();
}
async function allowAI(btn){
  const perms=await permsPromise;
  if(!perms){AIPERM='granted';refreshAI();return}
  btn.disabled=true;btn.textContent='Waiting for your answer…';
  const r=await perms.request(['sample']).catch(()=>({}));
  AIPERM=r.sample||'denied';refreshAI();
  toast(AIPERM==='granted'?'Claude is on. You can upload your own photo.':'Claude stays off. Use a sample photo or fill in the details by hand.');
}
async function manageAI(){
  const perms=await permsPromise;if(!perms)return;
  try{await perms.manage()}catch(e){toast("Open this page's Permissions menu to change Claude access.")}
  AIPERM=await perms.state('sample').catch(()=>AIPERM);refreshAI();
}

function runAnalysis(){
  const s=S.sell;s.timers.forEach(clearTimeout);s.timers=[];
  const lis=[...document.querySelectorAll('#psteps li')],bar=$('#pbar');
  const setStep=i=>{lis.forEach((x,j)=>{x.className=j<i?'did':j===i?'now':'';x.querySelector('.dot').innerHTML=j<i?ICON.check:''});bar.style.width=Math.min(100,(i+1)/lis.length*100-8)+'%'};
  if(s.blob&&!S.aiFail){setStep(0);readPhotoWithAI(s,setStep,lis);return}
  const failAt=S.aiFail?2:99;
  lis.forEach((li,i)=>{
    s.timers.push(setTimeout(()=>{
      if(i>=failAt) return;
      setStep(i);
    },i*750));
  });
  if(S.aiFail){
    s.timers.push(setTimeout(()=>{s.failed=true;s.ai={};s.step='review';rerender()},4200));
  } else {
    s.timers.push(setTimeout(()=>{
      bar.style.width='100%';
      const r=AI_RESULTS[s.photo];Object.assign(s.f,{title:r.title,desc:r.desc,cat:r.cat,cond:r.cond});
      s.ai={title:true,desc:true,cat:true,cond:true};s.failed=false;s.step='review';rerender();
      toast('Details filled in. Check them before publishing.');
    },lis.length*750+300));
  }
}
function publish(){
  const s=S.sell,f=s.f,e={};
  if(!f.title.trim()) e.title='Add a title so buyers know what this is.';
  if(!f.cat) e.cat='Choose a category.';
  if(!f.cond) e.cond='Choose a condition.';
  if(!f.price||+f.price<=0) e.price='Enter a price of at least $1. Use $1 for free items.';
  if(!f.area) e.area='Choose where buyers pick up.';
  const today=new Date().toISOString().slice(0,10);
  if(!f.moveout) e.moveout='Add your move-out date.'; else if(f.moveout<today) e.moveout='This date has already passed.';
  s.errors=e;
  if(Object.keys(e).length){rerender();const first=document.querySelector('.field.invalid input, .field.invalid select, .field.invalid textarea');first&&first.focus();toast(`Fix ${Object.keys(e).length} field${Object.keys(e).length>1?'s':''} before publishing.`);return}
  const id=S.nextId++;
  S.listings.unshift({id,title:f.title.trim(),price:+f.price,cat:f.cat,cond:f.cond,area:f.area,moveout:f.moveout,seller:'You',status:'Available',art:ART_FOR[f.cat]||s.photo,tone:2,posted:0,desc:f.desc.trim()||'No description.',img:s.file,saved:false});
  s.step='done';s.publishedId=id;rerender();
}

    case 'marksold':markSold(L(id));break;
    case 'del':{const l=L(id),chats=S.threads.filter(t=>t.listing===l.id).length;
      confirmBox(`Delete “${l.title}”?`,`This can't be undone.${chats?` ${chats} buyer${chats>1?'s':''} in open chats will see the item is no longer available.`:''}`,'Delete listing',true,()=>{l.deleted=true;rerender();toast('Listing deleted')});break}
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();go('item-'+e.target.dataset.id)}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cmsg'){e.preventDefault();$('[data-act=send]').click()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.f.q=t.value;if(S.view!=='browse'){go('browse')}else renderGrid()}
  if(t.id==='fmax'){S.f.max=+t.value;$('#fmaxv').textContent=S.f.max>=150?'Any price':'Up to $'+S.f.max;renderGrid()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-fcond]')){S.f.conds=[...document.querySelectorAll('[data-fcond]:checked')].map(x=>x.value);renderGrid()}
  if(t.id==='fdist'){S.f.dist=t.value;renderGrid()}
  if(t.id==='fpend'){S.f.pending=t.checked;renderGrid()}
  if(t.id==='fsaved'){S.f.saved=t.checked;renderGrid()}
  if(t.id==='sort'){S.f.sort=t.value;renderGrid()}
  if(t.id==='aifail'){S.aiFail=t.checked;toast(t.checked?'AI failure on: listing and reply drafts will fail':'AI failure off')}
});
route();
checkAI();
</script>

</body></html>
